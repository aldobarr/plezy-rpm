name: Keep Scheduled Workflows Active

on:
  schedule:
    - cron: '23 3 * * 2,6'

permissions:
  contents: read

jobs:
  keepalive:
    name: Keep scheduled workflows active
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Keep scheduled workflows active after prolonged inactivity
        run: ./scripts/keepalive.sh
